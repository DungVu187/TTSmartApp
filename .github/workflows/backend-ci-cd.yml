name: Backend CI and IIS delivery

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci-cd.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci-cd.yml'
  workflow_dispatch:
    inputs:
      runner_preflight:
        description: 'Check the VPS runner, runtime, and safe write access without deploying'
        type: boolean
        required: true
        default: false
      deploy:
        description: 'Deploy the tested backend artifact to TTSmartMobileApi on IIS'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build, test, and publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore backend/TTSmart.sln
      - name: Test without SQL E2E
        run: dotnet test backend/tests/TTSmart.Api.Tests/TTSmart.Api.Tests.csproj -c Release --no-restore --filter "Category!=SqlE2E" --verbosity normal
      - name: Publish API
        shell: powershell
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'ttsmart-api-publish'
          dotnet publish backend/src/TTSmart.Api/TTSmart.Api.csproj -c Release --no-restore -o $output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item -LiteralPath (Join-Path $output 'appsettings.Development.json') -ErrorAction SilentlyContinue
          Set-Content -LiteralPath (Join-Path $output 'release-id.txt') -Value '${{ github.sha }}' -Encoding Ascii
          if (-not (Test-Path -LiteralPath (Join-Path $output 'web.config'))) { throw 'IIS web.config was not published.' }
      - uses: actions/upload-artifact@v4
        with:
          name: ttsmart-api-${{ github.sha }}
          path: ${{ runner.temp }}/ttsmart-api-publish/
          if-no-files-found: error
          retention-days: 14

  runner_preflight:
    name: Check VPS runner without deploying
    if: github.event_name == 'workflow_dispatch' && inputs.runner_preflight && github.ref == 'refs/heads/main'
    needs: build
    runs-on: [self-hosted, windows, x64, ttsmart-iis]
    steps:
      - name: Check IIS files and runner permissions
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $site = 'C:\Deploy\TTSmartMobileApi'
          $backups = 'C:\Deploy\TTSmartMobileApi-backups'
          Write-Host "Runner account: $(whoami)"
          foreach ($file in @('web.config', 'appsettings.json')) {
            if (-not (Test-Path -LiteralPath (Join-Path $site $file) -PathType Leaf)) {
              throw "IIS site is missing $file"
            }
          }
          $module = Join-Path ${env:ProgramFiles} 'IIS\Asp.Net Core Module\V2\aspnetcorev2.dll'
          if (-not (Test-Path -LiteralPath $module -PathType Leaf)) {
            throw 'ASP.NET Core IIS module file is missing.'
          }
          $runtimes = & dotnet --list-runtimes
          if ($LASTEXITCODE -ne 0 -or -not ($runtimes -match '^Microsoft\.AspNetCore\.App 10\.')) {
            throw 'ASP.NET Core 10 runtime is missing.'
          }
          foreach ($directory in @($site, $backups)) {
            if (-not (Test-Path -LiteralPath $directory -PathType Container)) {
              throw "Required directory does not exist: $directory"
            }
            $probe = Join-Path $directory ('.ttsmart-ci-probe-' + [guid]::NewGuid().ToString('N') + '.tmp')
            try {
              [IO.File]::WriteAllText($probe, 'write check')
            }
            finally {
              if (Test-Path -LiteralPath $probe) { Remove-Item -LiteralPath $probe -Force }
            }
          }
          Write-Host 'Runner preflight passed. No application files were replaced.'

  deploy:
    name: Deploy to IIS
    # Paused: the VPS also has a PM2 process named ttsmart-api. Confirm which
    # process owns port 5003 before any workflow may replace production files.
    if: ${{ false }}
    needs: build
    runs-on: [self-hosted, windows, x64, ttsmart-iis]
    environment: production
    concurrency:
      group: ttsmart-mobile-api-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ttsmart-api-${{ github.sha }}
          path: ${{ runner.temp }}/ttsmart-api-publish
      - name: Deploy tested artifact and check IIS plus Nginx
        shell: powershell
        run: |
          .\backend\scripts\deploy-iis.ps1 `
            -PackageDirectory (Join-Path $env:RUNNER_TEMP 'ttsmart-api-publish') `
            -SiteName 'TTSmartMobileApi' `
            -AppPoolName 'TTSmartMobileApi' `
            -SitePath 'C:\Deploy\TTSmartMobileApi' `
            -BackupRoot 'C:\Deploy\TTSmartMobileApi-backups' `
            -LocalHealthUrl 'http://127.0.0.1:5003/health/live' `
            -PublicHealthUrl 'https://mobile.dangnhap.net/health/live' `
            -ReleaseId '${{ github.sha }}' `
            -Apply
